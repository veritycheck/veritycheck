<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="ie=edge" />
<title>@veritycheck</title>
<link rel="icon" type="image/x-icon" href="../1/favicon.ico">

<meta property="og:title" content="The Walls" />
<meta property="og:description" content="the wall for everyone else. pulled straight from my tiktok comments." />
<meta property="og:url" content="https://veritycheck.xyz/everyone/" />
<meta property="og:image" content="https://veritycheck.xyz/og.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="The Walls" />
<meta name="twitter:description" content="the wall for everyone else. pulled straight from my tiktok comments." />
<meta name="twitter:image" content="https://veritycheck.xyz/og.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="head">
    <h1 class="title" id="wallName">…</h1>
    <p class="count" id="wallCount"></p>
    <p class="sub">coolish people that commented on my video</p>
    <a class="back" href="../3/">&larr; pick a door</a>
  </header>

  <main class="board" id="board"></main>

  <footer class="footer">
    <p class="footer-mark">@veritycheck</p>
  </footer>

<script>
  const NAMES = [
    "The Normal Wall",
    "The Guest List",
    "The Guestbook",
    "Everyone else",
  ];
  document.getElementById("wallName").textContent =
    NAMES[Math.floor(Math.random() * NAMES.length)];

  const COMMENT_FEED_URL = "";
  const VIDEO_ID = "7683055096590077206";
  const POLL_MS = 10000;

  const board = document.getElementById("board");
  let lastKey = null;

  function render(pins) {
    const key = JSON.stringify(pins);
    if (key === lastKey) {
      return;
    }
    lastKey = key;
    board.innerHTML = "";

    document.getElementById("wallCount").textContent =
      pins.length + (pins.length === 1 ? " person" : " people");

    if (pins.length === 0) {
      board.innerHTML =
        '<div class="empty-state"><p class="empty-title">no one here yet!</p><p class="empty-sub">comment on the video to get on the wall</p></div>';
      return;
    }

    pins.forEach((data, i) => {
      const pin = document.createElement("article");
      pin.className = "pin";
      pin.style.setProperty("--tilt", (Math.random() * 3 - 1.5).toFixed(2) + "deg");
      pin.style.setProperty("--i", i);

      const handle = data.user.startsWith("@") ? data.user : "@" + data.user;
      const avatar = data.avatar
        ? `<img class="pin-avatar" src="${data.avatar}" alt="${handle}">`
        : `<span class="pin-avatar">${handle[1].toUpperCase()}</span>`;
      const badge = i === 0 ? `<span class="pin-badge">#first</span>` : "";

      pin.innerHTML = `
        <div class="pin-head">
          ${avatar}
          <span class="pin-user">${handle}</span>
          ${badge}
        </div>
        <p class="pin-comment">${data.comment}</p>
      `;

      pin.addEventListener("click", () => {
        pin.classList.remove("is-popping");
        void pin.offsetWidth;
        pin.classList.add("is-popping");
      });
      pin.addEventListener("animationend", () => pin.classList.remove("is-popping"));

      board.appendChild(pin);
    });
  }

  function normalize(data) {
    if (Array.isArray(data)) {
      return data.map((p) => ({ ...p, _t: 0, _id: "" }));
    }
    if (Array.isArray(data?.pins)) {
      return data.pins.map((p) => ({ ...p, _t: 0, _id: "" }));
    }
    const list = data?.data?.comments;
    if (Array.isArray(list)) {
      return list
        .map((c) => ({
          user: c.user?.unique_id || c.user?.nickname || "unknown",
          avatar: c.user?.avatar || "",
          comment: (c.text || "").trim(),
          _t: c.create_time || 0,
          _id: String(c.id || c.comment_id || ""),
        }))
        .filter((p) => p.comment)
        .sort((a, b) => a._t - b._t || a._id.localeCompare(b._id));
    }
    return null;
  }

  function tryFetch(url) {
    const bust = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
    return fetch(bust)
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error("bad response"))))
      .then(normalize);
  }

  const tikwmUrl = "https://www.tikwm.com/api/comment/list/?url=" +
    encodeURIComponent("https://www.tiktok.com/@veritycheck/video/" + VIDEO_ID) +
    "&count=50";

  const sources = [tikwmUrl];
  if (COMMENT_FEED_URL) {
    sources.push(COMMENT_FEED_URL);
  }
  sources.push("comments.json");

  function tryNext(i) {
    if (i >= sources.length) {
      return Promise.resolve([]);
    }
    return tryFetch(sources[i]).then(
      (pins) => (Array.isArray(pins) ? pins : tryNext(i + 1)),
      () => tryNext(i + 1)
    );
  }

  function refresh() {
    tryNext(0).then(render);
  }

  refresh();
  setInterval(refresh, POLL_MS);
</script>

</body>
</html>
