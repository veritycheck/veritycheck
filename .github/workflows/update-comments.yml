name: update guestbook comments

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-comments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: scrape comments
        run: python serverless/update-comments.py

      - name: commit if changed
        run: |
          git config user.name "comments-bot"
          git config user.email "actions@users.noreply.github.com"
          git add everyone/comments.json
          if git diff --cached --quiet; then
            echo "no new comments"
          else
            git commit -m "refresh guestbook comments"
            git push
          fi
